<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MJ ติดตามงานหน่วยงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: operations console — top bar + tabbed workspace; summary strip before detail tables; report renders as an A4 paper sheet */
:root{
  --bg:#EFF2F1; --surface:#FFFFFF; --surface-2:#E6EBE9; --ink:#14232A; --muted:#566A70; --line:#D3DBD8;
  --accent:#0D6A5D; --accent-ink:#FFFFFF; --accent-soft:#D8EEE8;
  --ok:#1C7A3C; --ok-soft:#DDF1E3; --warn:#9A5800; --warn-soft:#FBEBD2; --bad:#B42318; --bad-soft:#FBE1DE;
  --info:#1B5EA6; --info-soft:#DCE9F8; --neutral:#5F6B6E; --neutral-soft:#E4E8E7;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-line:#8A8A8A;
  --shadow:0 1px 2px rgba(20,35,42,.06),0 4px 16px rgba(20,35,42,.06);
  --f-display:"Bai Jamjuree","IBM Plex Sans Thai",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Thai",Tahoma,"Leelawadee UI",sans-serif;
  --f-doc:"Sarabun","TH Sarabun New",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1618; --surface:#152023; --surface-2:#1C2A2E; --ink:#E2EBE8; --muted:#92A6A9; --line:#2A3B3F;
  --accent:#3DBBA4; --accent-ink:#04211C; --accent-soft:#123A33;
  --ok:#55C47F; --ok-soft:#163A24; --warn:#E3A642; --warn-soft:#3D2C10; --bad:#F2786A; --bad-soft:#44201C;
  --info:#73AEF0; --info-soft:#162E4A; --neutral:#A3B0B2; --neutral-soft:#263336;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1618; --surface:#152023; --surface-2:#1C2A2E; --ink:#E2EBE8; --muted:#92A6A9; --line:#2A3B3F;
  --accent:#3DBBA4; --accent-ink:#04211C; --accent-soft:#123A33;
  --ok:#55C47F; --ok-soft:#163A24; --warn:#E3A642; --warn-soft:#3D2C10; --bad:#F2786A; --bad-soft:#44201C;
  --info:#73AEF0; --info-soft:#162E4A; --neutral:#A3B0B2; --neutral-soft:#263336;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:1.45rem;font-weight:700} h2{font-size:1.12rem;font-weight:600} h3{font-size:1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;white-space:nowrap}
.logo{height:32px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;flex:none}.logo-lg{height:46px;padding:4px 8px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;letter-spacing:.02em}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button:hover{color:var(--ink)}
.who{margin-left:auto;display:flex;align-items:center;gap:8px 10px;font-size:.85rem;color:var(--muted);min-width:0;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.who{margin-left:0;width:100%;justify-content:flex-start}.who strong{flex-basis:100%;order:-1}}
.who strong{color:var(--ink);font-weight:600}
.role-chip{font-size:.72rem;letter-spacing:.03em;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.demo-bar{background:var(--warn-soft);color:var(--warn);font-size:.85rem;text-align:center;padding:6px 16px}

main{max-width:1320px;margin:0 auto;padding-block:20px 60px;padding-inline:16px}
.page-head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.page-head .sub{color:var(--muted);font-size:.88rem;margin-top:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{padding:4px 10px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=search],select,textarea{
  border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted);font-weight:500;min-width:0}
label.f.req>span:first-child::after{content:" *";color:var(--bad)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2} .span3{grid-column:1/-1}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.span2{grid-column:auto}}
.scope{min-width:220px;max-width:340px}

/* cards & kpis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--k,var(--line))}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-size:1.7rem;font-weight:700;line-height:1.1}
.kpi small{font-size:.76rem;color:var(--muted)}
.dash{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.dash{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* bars */
.sbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hrow{display:grid;grid-template-columns:120px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:.86rem;padding:3px 0}
.hrow .track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex}
.hrow .track i{display:block;height:100%}
.hrow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.budget{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.budget div span{display:block;font-size:.8rem;color:var(--muted)}
.budget div b{font-family:var(--f-display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--bad)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;letter-spacing:.02em;background:var(--surface-2);padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer}
table.t tbody tr.click:hover td{background:var(--accent-soft)}
td.n,th.n{text-align:right;white-space:nowrap}
td.nowrap{white-space:nowrap}
.code{font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ttl{font-weight:500}
.ref{display:block;font-size:.78rem;color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:.77rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-not_started{background:var(--neutral-soft);color:var(--neutral)}
.st-in_progress{background:var(--info-soft);color:var(--info)}
.st-on_hold{background:var(--warn-soft);color:var(--warn)}
.st-done{background:var(--ok-soft);color:var(--ok)}
.st-cancelled{background:var(--neutral-soft);color:var(--neutral);text-decoration:line-through}
.st-late{background:var(--bad-soft);color:var(--bad)}
.prog{display:flex;align-items:center;gap:8px;min-width:110px}
.prog .meter{flex:1;margin:0}
.prog span{font-size:.78rem;color:var(--muted);width:34px;text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted)}
.open-tbl td{font-size:.86rem}
.open-tbl .src{display:block;font-size:.78rem;color:var(--muted);margin-top:2px}
.open-tbl .due-left{display:block;font-size:.76rem;color:var(--muted)}
.open-tbl .due-left.soon{color:var(--warn);font-weight:600}
.open-tbl .due-left.late{color:var(--bad)}
.open-tbl .lastnote{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.open-tbl .lastmeta{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.open-tbl .prog{min-width:96px;margin-top:6px}
.filters{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:760px){.filters{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.filters .q{grid-column:1/-1}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,20,24,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(860px,100%);border:1px solid var(--line)}
.modal.sm{width:min(480px,100%)}
.m-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.m-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.m-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);padding:2px 6px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 16px}
@media (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.facts div span{display:block;font-size:.76rem;color:var(--muted)}
.facts div b{font-weight:500;font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.timeline li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.timeline .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:4px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--accent)}
.timeline li.sys .dot{background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.timeline .meta{font-size:.78rem;color:var(--muted)}
.timeline li.sys .note{color:var(--muted);font-size:.86rem}
.boxed{background:var(--surface-2);border-radius:var(--r);padding:14px}
.hint{font-size:.82rem;color:var(--muted)}
.err{color:var(--bad);font-size:.86rem}
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;width:max-content;max-width:calc(100% - 32px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;box-shadow:var(--shadow);font-size:.9rem;max-width:100%}
.toast.bad{background:var(--bad);color:var(--surface)}

/* notifications */
.bell{position:relative}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}
.alert-strip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.alert-strip b{color:var(--ink)}
.nlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.nlist li{border-bottom:1px solid var(--line)} .nlist li:last-child{border-bottom:0}
.nlist button{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:var(--surface);padding:10px 12px;cursor:pointer}
.nlist button:hover{background:var(--accent-soft)}
.nlist .dotu{width:8px;height:8px;border-radius:50%;margin-top:8px;background:var(--bad)}
.nlist li.read .dotu{background:transparent}
.nlist li.read .ttl{font-weight:400;color:var(--muted)}
.nlist .when{font-size:.8rem;color:var(--warn);font-weight:600;white-space:nowrap;text-align:right}
.pwrow{display:flex;gap:8px} .pwrow input{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
.seg{display:flex;gap:6px;border:0;padding:0;margin:0}
.seg label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
.cred{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px;font-size:.88rem;user-select:all}

/* วินัยการบันทึก */
.flag{display:inline-block;margin-top:4px;margin-right:4px;padding:1px 8px;border-radius:99px;font-size:.74rem;font-weight:600;background:var(--bad-soft);color:var(--bad)}
.rev-ok{color:var(--ok);font-weight:600;font-size:.8rem;white-space:nowrap}
.rev-sub{display:block;font-size:.74rem;color:var(--muted);max-width:170px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer;font-size:.86rem}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.disc-strip{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.disc-strip b{color:var(--ink)}
.page .rev-note{font-size:9pt;line-height:1.4;color:#1C7A3C;margin-top:1mm}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.lg-head{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.lg-head .logo{height:64px;padding:6px 12px;border-radius:10px}
.lg-head h1{font-size:1.3rem;margin:0}.lg-head p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.5}
.pw-wrap{position:relative;display:block}.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:6px}
.pw-eye svg{width:20px;height:20px}
.pw-eye:hover{color:var(--ink);background:var(--surface-2)}
.lg-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.lg-foot{text-align:center;font-size:.76rem;color:var(--muted);margin:4px 0 0;padding-top:12px;border-top:1px solid var(--line)}
.demo-roles{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.demo-roles button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.demo-roles button:hover{border-color:var(--accent);background:var(--accent-soft)}
.demo-roles small{display:block;color:var(--muted);font-size:.8rem}

/* admin tabs */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.subtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.88rem;cursor:pointer}
.checks label small{display:block;color:var(--muted);font-size:.76rem}

/* report sheet — printed document convention (white A4) */
.rep-controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.rep-controls.names{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rep-range{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.rep-range .hint{margin-right:4px}
.sheet-wrap{overflow-x:auto;padding:4px 0 10px}
.pages{display:flex;flex-direction:column;gap:16px}
.page{width:297mm;height:210mm;padding:10mm 12mm;margin:0 auto;flex:none;background:var(--paper);color:var(--paper-ink);font-family:var(--f-doc);font-size:11pt;line-height:1.35;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg-in{height:100%;display:flex;flex-direction:column;gap:3mm}
.ph{display:grid;grid-template-columns:72mm minmax(0,1fr) 72mm;align-items:center;gap:4mm;padding-bottom:2.5mm;border-bottom:0.5mm solid #333}
.ph .logos{display:flex;align-items:center;gap:4mm;min-height:13mm}
.ph .logos img{height:13mm;width:auto;max-width:34mm;object-fit:contain}

<script>
/* =====================================================================

   ถ้าเว้นว่าง ระบบจะเปิดในโหมดสาธิต (ข้อมูลตัวอย่าง ไม่บันทึกจริง)
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://lfewevxsfonajvmlngqb.supabase.co",        // เช่น "https://abcdefgh.supabase.co"
  SUPABASE_KEY: "sb_publishable_dG4tnhetWJqYeno6ehHiZw_BAP91zgT",        // Publishable key (หรือ anon public key) — ห้ามใช้ secret / service_role key
  COMPANY_NAME: "Major Property Service Co., Ltd.",
  USERNAME_DOMAIN: "staff.mjpropertyservice.co.th",   // ต้องตรงกับ USERNAME_DOMAIN ในไฟล์ admin-users.ts
  SELF_RESET: false,      // true = แสดงปุ่ม "ลืมรหัสผ่าน" ให้ผู้ใช้รีเซ็ตเองทางอีเมล (ต้องตั้ง SMTP ใน Supabase ก่อน)

};
const SUPABASE_JS = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js";
const XLSX_JS = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";

/* ---------- ค่าคงที่ ---------- */
const STATUS = {
  not_started:{label:"ยังไม่เริ่ม", color:"var(--neutral)"},
  in_progress:{label:"กำลังดำเนินการ", color:"var(--info)"},
  on_hold:{label:"ชะลอ/ติดปัญหา", color:"var(--warn)"},
  done:{label:"แล้วเสร็จ", color:"var(--ok)"},
  cancelled:{label:"ยกเลิก", color:"var(--line)"}
};
const SOURCE = {
  agm:"มติที่ประชุมใหญ่", board_meeting:"มติที่ประชุมคณะกรรมการ", board_approval:"คณะกรรมการอนุมัติ",
  routine:"งานประจำตามตำแหน่ง", other:"อื่น ๆ"
};
const CATEGORY = {
  manager:"ผู้จัดการ", asst_manager:"ผู้ช่วยผู้จัดการ", admin:"ธุรการ",
  finance:"การเงิน", building:"ฝ่ายอาคาร", technician:"ช่าง"
};
const KIND = { condo:"อาคารชุด", village:"หมู่บ้านจัดสรร", other:"อื่น ๆ" };

/* ---------- เครื่องมือ ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* วันที่ทั้งหมดคิดตามเวลาประเทศไทย ให้ตรงกับฐานข้อมูล แม้เครื่องผู้ใช้ตั้งเขตเวลาอื่น */
const TZ = "Asia/Bangkok";
const today = () => new Date().toLocaleDateString("en-CA", {timeZone:TZ});
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return x.toLocaleDateString("en-CA"); };
const dTH = (d, long=false) => d ? new Date(String(d).slice(0,10) + "T00:00:00").toLocaleDateString("th-TH", long ? {day:"numeric",month:"long",year:"numeric"} : {day:"numeric",month:"short",year:"2-digit"}) : "–";
const dtTH = ts => ts ? new Date(ts).toLocaleString("th-TH", {timeZone:TZ, day:"numeric",month:"short",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
const money = v => { if (v === null || v === undefined || v === "") return "–"; const n = Number(v), d = Math.round(n * 100) % 100 ? 2 : 0; return n.toLocaleString("th-TH", {minimumFractionDigits:d, maximumFractionDigits:2}); };
const numOrNull = v => (v === "" || v === null || v === undefined) ? null : Number(v);
const isOpen = t => t.status !== "done" && t.status !== "cancelled";
const isLate = t => isOpen(t) && t.due_date && t.due_date < today();
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));

/* วินัยการบันทึก */
const STALE_DAYS = 14;
const LEVEL = { none:{label:"ยังไม่บันทึกงาน", cls:"st-late", rank:0}, inactive:{label:"ขาดการบันทึก", cls:"st-late", rank:1},
  attention:{label:"ต้องติดตาม", cls:"st-on_hold", rank:2}, ok:{label:"ปกติ", cls:"st-done", rank:3} };
const localDay = ts => ts ? new Date(ts).toLocaleDateString("en-CA", {timeZone:TZ}) : null;
const monthStart = off => { const [y, m] = today().split("-").map(Number), i = y * 12 + (m - 1) + off; return Math.floor(i / 12) + "-" + String(i % 12 + 1).padStart(2, "0") + "-01"; };
const monthTH = p => p ? new Date(p + "T00:00:00").toLocaleDateString("th-TH", {month:"short", year:"2-digit"}) : "";
const daysAgo = ts => ts ? Math.floor((Date.now() - new Date(ts).getTime()) / 864e5) : null;
const agoText = ts => { const n = daysAgo(ts); return n === null ? "ไม่เคยบันทึก" : n <= 0 ? "วันนี้" : n + " วันที่แล้ว"; };
const isStale = t => { const a = (S.act || {})[t.id]; return isOpen(t) && (!a || !a.last_update_at || new Date(a.last_update_at) < new Date(Date.now() - STALE_DAYS * 864e5)); };
const isUnexplained = t => { const a = (S.act || {})[t.id]; return isOpen(t) && t.due_date && t.due_date < today() && !(a && a.explained_after_due); };

/* User ID ภาษาอังกฤษ → อีเมลภายในระบบ (ไม่ต้องมีกล่องอีเมลจริง) */
const toLoginEmail = v => { v = String(v || "").trim().toLowerCase(); return v.includes("@") ? v : v + "@" + CONFIG.USERNAME_DOMAIN; };
const isUsername = email => String(email || "").toLowerCase().endsWith("@" + CONFIG.USERNAME_DOMAIN);
const loginLabel = email => isUsername(email) ? String(email).split("@")[0] : String(email || "");
const USERNAME_RE = /^[a-z][a-z0-9._-]{2,29}$/;
function genPassword(){
  const c = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789"; const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, x => c[x % c.length]).join("");
}
const daysLeft = d => Math.round((new Date(d + "T00:00:00") - new Date(today() + "T00:00:00")) / 86400000);
const leftText = d => { const n = daysLeft(d); return n < 0 ? "เกินกำหนด " + (-n) + " วัน" : n === 0 ? "ครบกำหนดวันนี้" : "อีก " + n + " วัน"; };

function loadScript(src){
  return new Promise((ok, no) => {
    if ($(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("โหลดไลบรารีไม่สำเร็จ: " + src));
    document.head.appendChild(s);
  });
}
function toast(msg, bad=false){
  let box = $("#toasts"); if (!box){ box = document.createElement("div"); box.id = "toasts"; document.body.appendChild(box); }
  const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.setAttribute("role","status"); t.textContent = msg;
  box.appendChild(t); setTimeout(() => t.remove(), bad ? 6000 : 3000);
}
function thaiError(e){
  const m = (e && (e.message || e.error_description || e.msg)) || String(e);
  if (/Invalid login credentials/i.test(m)) return "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
  if (/row-level security|permission denied|ไม่มีสิทธิ์/i.test(m)) return m.includes("ไม่มีสิทธิ์") ? m : "ไม่มีสิทธิ์ดำเนินการนี้";
  if (/multiple \(or no\) rows|0 rows/i.test(m)) return "ไม่มีสิทธิ์แก้ไขรายการนี้ หรือรายการถูกลบไปแล้ว";
  if (/duplicate key.*units_code/i.test(m)) return "รหัสหน่วยงานนี้มีอยู่แล้ว";
  if (/duplicate key.*roles_name/i.test(m)) return "มีบทบาทชื่อนี้แล้ว";
  if (/roles_own_unit_no_review/i.test(m)) return "บทบาทแบบบัญชีหน่วยงานให้สิทธิ์ตรวจรับรองไม่ได้";
  if (/profiles_notify_email_check/i.test(m)) return "รูปแบบอีเมลรับแจ้งเตือนไม่ถูกต้อง";
  if (/profiles_role_fkey/i.test(m)) return "ลบไม่ได้: ยังมีผู้ใช้ในบทบาทนี้";
  if (/units_code_check/i.test(m)) return "รหัสหน่วยงานใช้ได้เฉพาะ A–Z, 0–9, - หรือ _ ความยาว 2–20 ตัว";
  if (/Failed to fetch|NetworkError/i.test(m)) return "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ต";
  if (/Function not found|404/i.test(m) && /function/i.test(m)) return "ยังไม่ได้ติดตั้งฟังก์ชัน admin-users ใน Supabase (ดูคู่มือข้อ 2.6)";
  if (/New password should be different/i.test(m)) return "รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสผ่านเดิม";
  return m;
}
function download(name, content, type){
  const blob = content instanceof Blob ? content : new Blob([content], {type});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* =====================================================================
   ชั้นข้อมูล: Supabase
   ===================================================================== */
class SupaDB {
  async init(){
    await loadScript(SUPABASE_JS);
    this.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  }
  ok({data, error}){ if (error) throw error; return data; }
  async session(){ return this.ok(await this.sb.auth.getSession()).session; }
  async signIn(login, password){ this.ok(await this.sb.auth.signInWithPassword({email: toLoginEmail(login), password})); }
  async passwordChanged(){ this.ok(await this.sb.rpc("password_changed")); }
  async notifications(){ return this.ok(await this.sb.rpc("my_notifications")) || []; }
  async markRead(ids){ if (ids.length) this.ok(await this.sb.rpc("mark_notifications_read", {p_ids: ids})); }
  async adminUsers(body){
    const {data, error} = await this.sb.functions.invoke("admin-users", {body});
    if (error){
      let msg = error.message;
      try { if (error.context && typeof error.context.json === "function"){ const j = await error.context.json(); if (j && j.error) msg = j.error; } } catch (_){}
      if (error.name === "FunctionsFetchError" || error.name === "FunctionsRelayError") msg = "ยังไม่ได้ติดตั้งฟังก์ชัน admin-users ใน Supabase หรือเชื่อมต่อไม่ได้ (ดูคู่มือข้อ 2.6)";
      throw new Error(msg);
    }
    return data;
  }
  async createAccount(a){ return this.adminUsers({action:"create", ...a}); }
  async resetPassword(userId, password){ return this.adminUsers({action:"reset_password", user_id:userId, password}); }
  async deleteAccount(userId){ return this.adminUsers({action:"delete_user", user_id:userId}); }
  async signOut(){ await this.sb.auth.signOut(); }
  async sendResetLink(email){ this.ok(await this.sb.auth.resetPasswordForEmail(String(email).trim().toLowerCase(), {redirectTo: location.href.split("#")[0].split("?")[0]})); }
  async changePassword(pw){ this.ok(await this.sb.auth.updateUser({password: pw})); }
  async me(){
    const s = await this.session(); if (!s) return null;
    const p = this.ok(await this.sb.from("profiles").select("*").eq("user_id", s.user.id).maybeSingle());
    return p ? p : {email: s.user.email, role: null};
  }
  async all(table, build){
    let out = [], from = 0; const size = 1000;
    for (;;){
      let q = this.sb.from(table).select("*");
      if (build) q = build(q);
      const data = this.ok(await q.order("id", {ascending:true}).range(from, from + size - 1));
      out = out.concat(data); if (data.length < size) break; from += size;
    }
    return out;
  }
  async units(){ return this.ok(await this.sb.from("units").select("id,code,name,kind,active,created_at").order("code")); }
  async unitLogo(id){ const r = this.ok(await this.sb.from("units").select("logo").eq("id", id).maybeSingle()); return r ? r.logo : null; }
  async setUnitLogo(id, logo){ this.ok(await this.sb.from("units").update({logo}).eq("id", id).select("id").single()); }
  async companyLogo(){ const r = this.ok(await this.sb.from("app_settings").select("value").eq("key", "company_logo").maybeSingle()); return r ? r.value : null; }
  async setCompanyLogo(v){ this.ok(await this.sb.from("app_settings").upsert({key:"company_logo", value:v, updated_at:new Date().toISOString()})); }
  async tasks(){ return this.all("tasks"); }
  async updates(taskId){ return this.ok(await this.sb.from("task_updates").select("*").eq("task_id", taskId).order("created_at", {ascending:false})); }
  async updatesForUnit(unitId){ return this.all("task_updates", q => q.eq("unit_id", unitId)); }
  async createTask(row){ return this.ok(await this.sb.from("tasks").insert(row).select().single()); }
  async updateTask(id, patch){ return this.ok(await this.sb.from("tasks").update(patch).eq("id", id).select().single()); }
  async deleteTask(id){ this.ok(await this.sb.from("tasks").delete().eq("id", id)); }
  async addUpdate(row){ this.ok(await this.sb.from("task_updates").insert(row)); }
  async reviewers(unitId){ return (this.ok(await this.sb.rpc("unit_reviewers", {p_unit_id: unitId})) || []).map(r => r.display_name); }
  /* ผู้ดูแลระบบ */
  async saveUnit(u){
    if (u.id) return this.ok(await this.sb.from("units").update({code:u.code, name:u.name, kind:u.kind, active:u.active}).eq("id", u.id).select().single());
    return this.ok(await this.sb.from("units").insert({code:u.code, name:u.name, kind:u.kind}).select().single());
  }
  async deleteUnit(id, code){ return this.ok(await this.sb.rpc("admin_delete_unit", {p_unit_id:id, p_confirm_code:code})); }
  async profiles(){ return this.ok(await this.sb.from("profiles").select("*").order("email")); }
  async upsertProfile(p){ return this.ok(await this.sb.rpc("admin_upsert_profile", {p_email:p.email, p_role:p.role, p_unit_id:p.unit_id || null, p_display_name:p.display_name || null, p_active:p.active,
    p_email_due: p.email_due ?? null, p_email_digest: p.email_digest ?? null, p_notify_email: p.notify_email ?? null})); }
  async notifySettings(){ return this.ok(await this.sb.from("notify_settings").select("*").eq("id", 1).maybeSingle()); }
  async saveNotifySettings(v){ return this.ok(await this.sb.from("notify_settings").update({due_days:v.due_days, due_hour:v.due_hour, digest_dow:v.digest_dow, digest_hour:v.digest_hour,
    updated_at:new Date().toISOString(), updated_by:S.me.display_name || S.me.email}).eq("id", 1).select().single()); }
  async setEmailPrefs(userId, patch){ return this.ok(await this.sb.from("profiles").update(patch).eq("user_id", userId).select().single()); }
  async deleteProfile(userId){ this.ok(await this.sb.from("profiles").delete().eq("user_id", userId)); }
  async roles(){ return this.ok(await this.sb.from("roles").select("*").order("created_at")); }
  async saveRole(r){
    const row = {name:r.name, description:r.description || null, scope:r.scope, can_create:!!r.can_create, can_edit:!!r.can_edit, can_delete:!!r.can_delete,
      can_export:!!r.can_export, can_review:!!r.can_review, can_view_discipline:!!r.can_view_discipline};

  // Supabase ส่งได้ครั้งละไม่เกิน 1,000 แถว (ค่าเริ่มต้น) — ดึงเป็นหน้า ๆ จนครบ

/* =====================================================================
   ชั้นข้อมูล: โหมดสาธิต (ข้อมูลตัวอย่างในหน่วยความจำ จำลองสิทธิ์เหมือนของจริง)
   ===================================================================== */
/* รูปโลโก้ตัวอย่างสำหรับโหมดสาธิตเท่านั้น (ไม่ใช่โลโก้จริง) */
function demoLogo(l1, l2, color){
  try {
    const c = document.createElement("canvas"); c.width = 320; c.height = 120; const g = c.getContext("2d");
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, 320, 120); g.strokeStyle = color; g.lineWidth = 4; g.strokeRect(4, 4, 312, 112);
    g.fillStyle = color; g.textAlign = "center"; g.font = "bold 30px Tahoma, sans-serif"; g.fillText(l1, 160, 54); g.font = "22px Tahoma, sans-serif"; g.fillText(l2, 160, 90);
    return c.toDataURL("image/png");
  } catch (_){ return null; }
}
/* ย่อรูปโลโก้ที่อัปโหลดก่อนบันทึก (สูงสุด 480×240 px) */
function imageToDataURL(file){
  return new Promise((ok, no) => {
    if (!/^image\/(png|jpeg|webp|gif|svg\+xml)$/.test(file.type)) return no(new Error("รองรับไฟล์ PNG, JPG, WEBP, GIF หรือ SVG เท่านั้น"));
    if (file.size > 5 * 1024 * 1024) return no(new Error("ไฟล์ใหญ่เกิน 5 MB"));
    const r = new FileReader();
    r.onerror = () => no(new Error("อ่านไฟล์ไม่ได้"));
    r.onload = () => { const img = new Image();
      img.onerror = () => no(new Error("เปิดรูปไม่ได้ กรุณาลองไฟล์อื่น"));
      img.onload = () => {
        const k = Math.min(1, 480 / (img.naturalWidth || 480), 240 / (img.naturalHeight || 240));
        const w = Math.max(1, Math.round((img.naturalWidth || 480) * k)), h = Math.max(1, Math.round((img.naturalHeight || 240) * k));
        const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d");
        const jpg = file.type === "image/jpeg"; if (jpg){ g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); }
        g.drawImage(img, 0, 0, w, h);
        const out = c.toDataURL(jpg ? "image/jpeg" : "image/png", 0.9);
        if (out.length > 400000) return no(new Error("รูปมีรายละเอียดมากเกินไป กรุณาใช้ไฟล์ที่เรียบง่ายกว่านี้"));
        ok(out);
      };
      img.src = r.result; };
    r.readAsDataURL(file);
  });
}

const role = () => S.me && S.me.role;
/* สิทธิ์ตามบทบาท (ตาราง roles) — ฐานข้อมูลตรวจซ้ำทุกครั้งด้วย Row Level Security */
const roleOf = id => (S.roles || []).find(r => r.id === id);
const roleName = id => (roleOf(id) || {}).name || id || "–";
const perm = () => roleOf(role()) || {};
const myScope = () => perm().scope;
const isHQ = () => myScope() === "all";              // มองเห็นทุกหน่วยงาน
const isOwnUnit = () => myScope() === "own_unit";    // บัญชีของหน่วยงาน
const isAssigned = () => myScope() === "assigned";   // ดูแลเฉพาะหน่วยงานที่ได้รับมอบหมาย
const isAdmin = () => role() === "hq_admin";
const unitWritable = unitId => !!unitOf(unitId) && (isAdmin() || (unitOf(unitId) || {}).active !== false) && (!isOwnUnit() || S.me.unit_id === unitId);
const canWrite = unitId => !!perm().can_edit && unitWritable(unitId);
const canCreate = unitId => !!perm().can_create && unitWritable(unitId);
const canDelete = unitId => !!perm().can_delete && unitWritable(unitId);
const canCreateAny = () => S.units.some(u => canCreate(u.id));
const canExport = () => !!perm().can_export;
const canSeeDiscipline = () => !!perm().can_view_discipline;
const unitOf = id => S.units.find(u => u.id === id);
const tcode = t => { const u = unitOf(t.unit_id); return (u ? u.code : "?") + "-" + String(t.seq || 0).padStart(3, "0"); };
const scopedTasks = () => S.scope === "all" ? S.tasks : S.tasks.filter(t => t.unit_id === S.scope);
const scopeLabel = () => S.scope === "all" ? (isHQ() ? "ทุกหน่วยงาน" : "ทุกหน่วยงานที่ดูแล") : (unitOf(S.scope) || {}).name || "";

const getsNotifs = () => isOwnUnit() || isAssigned();
const dueDays = () => (S.ns && S.ns.due_days) || 3;
const notifyAddr = p => p.notify_email || (isUsername(p.email) ? null : p.email);
const DOW_TH = ["", "วันจันทร์", "วันอังคาร", "วันพุธ", "วันพฤหัสบดี", "วันศุกร์", "วันเสาร์", "วันอาทิตย์"];
const hourTH = h => String(h).padStart(2, "0") + ":00–" + String((+h + 1) % 24).padStart(2, "0") + ":00 น.";
const unreadCount = () => (S.notifs || []).filter(n => !n.is_read).length;
async function loadNotifs(){ S.notifs = []; if (!getsNotifs()) return; try { S.notifs = await db.notifications(); } catch (ex){ console.warn(ex); } }
async function reload(){
  [S.units, S.tasks, S.roles] = await Promise.all([db.units(), db.tasks(), db.roles()]);
  document.body.classList.toggle("noexp", !canExport());
  try { S.ns = (await db.notifySettings()) || S.ns; } catch (ex){ console.warn(ex); }
  await loadNotifs();
  try { S.act = Object.fromEntries((await db.taskActivity()).map(a => [a.task_id, a])); } catch (ex){ console.warn(ex); S.act = {}; }
  if (isOwnUnit()) S.scope = S.me.unit_id;
  else if (S.scope !== "all" && !unitOf(S.scope)) S.scope = "all";
}

async function afterLogin(){
  S.me = await db.me();
  if (!S.me) return renderLogin();
  if (!S.me.role || S.me.active === false){
    await db.signOut();
    return renderLogin("บัญชีนี้ยังไม่ได้รับสิทธิ์ใช้งาน หรือถูกระงับ กรุณาติดต่อผู้ดูแลระบบ สำนักงานใหญ่");
  }
  if (S.me.must_change_password){ const ok = await forcePasswordChange(); if (!ok) return; S.me = await db.me(); }
  S.view = "dashboard"; S.scope = "all";
  await reload();
  if (isOwnUnit() && !unitOf(S.me.unit_id)){
    await db.signOut(); S.me = null;
    return renderLogin("หน่วยงานของบัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อสำนักงานใหญ่");
  }
  renderShell();
}

function scopeSelect(id="scopeSel", allowAll=true){
  if (isOwnUnit()) return "";
  const units = S.units;
  return `<select id="${id}" class="scope" aria-label="เลือกหน่วยงาน">
    ${allowAll ? `<option value="all">${isHQ() ? "ทุกหน่วยงาน" : "ทุกหน่วยงานที่ดูแล"} (${units.length})</option>` : ""}
    ${units.map(u => `<option value="${u.id}" ${S.scope === u.id ? "selected" : ""}>${esc(u.code)} · ${esc(u.name)}${u.active ? "" : " (ระงับ)"}</option>`).join("")}
  </select>`;
}
function bindScope(after){ const s = $("#scopeSel"); if (!s) return; s.value = S.scope; s.onchange = () => { S.scope = s.value; after(); }; }

function stats(list){
  const s = {total:list.length, late:list.filter(isLate).length, bp:0, ba:0};
  Object.keys(STATUS).forEach(k => s[k] = list.filter(t => t.status === k).length);
  list.forEach(t => { if (t.status !== "cancelled"){ s.bp += Number(t.budget_planned || 0); s.ba += Number(t.budget_actual || 0); } });
  s.active = s.total - s.cancelled; s.donePct = pct(s.done, s.active);
  return s;
}
function statusBar(s){
  const keys = ["done","in_progress","on_hold","not_started","cancelled"];
  return `<div class="sbar" role="img" aria-label="สัดส่วนสถานะงาน">${keys.map(k => s[k] ? `<i style="width:${s[k] * 100 / s.total}%;background:${STATUS[k].color}" title="${STATUS[k].label} ${s[k]}"></i>` : "").join("")}</div>
    <div class="legend">${keys.map(k => `<span><i style="background:${STATUS[k].color}"></i>${STATUS[k].label} <b class="num">${s[k]}</b></span>`).join("")}</div>`;
}
function hbars(list, field, labels){
  const max = Math.max(1, ...Object.keys(labels).map(k => list.filter(t => t[field] === k).length));
  return Object.entries(labels).map(([k, l]) => {
    const all = list.filter(t => t[field] === k), done = all.filter(t => t.status === "done").length;
    return `<div class="hrow"><span>${l}</span><div class="track" title="ทั้งหมด ${all.length} · แล้วเสร็จ ${done}">
      <i style="width:${done * 100 / max}%;background:var(--ok)"></i><i style="width:${(all.length - done) * 100 / max}%;background:var(--info);opacity:.55"></i></div>
      <span class="v">${done}/${all.length}</span></div>`;
  }).join("");
}
function renderDashboard(){
  const list = scopedTasks(), s = stats(list), T = today();
  const soon = list.filter(t => isOpen(t) && t.due_date && t.due_date >= T && t.due_date <= addDays(T, 14)).sort((a,b) => a.due_date.localeCompare(b.due_date));
  const late = list.filter(isLate).sort((a,b) => a.due_date.localeCompare(b.due_date));
  const used = pct(s.ba, s.bp);
  $("#main").innerHTML = `
    <div class="page-head">
      <div><h1>ภาพรวมงาน · ${esc(scopeLabel())}</h1><div class="sub">ข้อมูล ณ วันที่ ${dTH(T, true)}</div></div>
      <div class="tools no-present">${S.scope !== "all" && canReview(S.scope) ? `<span id="revChip"></span>` : ""}${scopeSelect()}<button class="btn" id="presentBtn" title="แสดงผลเต็มจอสำหรับการประชุมคณะกรรมการ">โหมดนำเสนอ</button></div>
    </div>
    ${getsNotifs() && unreadCount() ? `<div class="alert-strip no-present" role="status"><span>มีงานจะครบกำหนดภายใน ${dueDays()} วัน <b>${unreadCount()}</b> รายการที่ยังไม่ได้เปิดดู</span><button class="btn sm" id="stripBtn">ดูรายการ</button></div>` : ""}
    <div id="discStrip" class="no-present"></div>
    <div class="kpis">
      <div class="kpi" style="--k:var(--accent)"><span>งานทั้งหมด</span><b>${s.total}</b><small>ไม่รวมยกเลิก ${s.active}</small></div>
      <div class="kpi" style="--k:var(--ok)"><span>แล้วเสร็จ</span><b>${s.done}</b><small>${s.donePct}% ของงานที่ดำเนินการ</small></div>
      <div class="kpi" style="--k:var(--info)"><span>กำลังดำเนินการ</span><b>${s.in_progress}</b><small>&nbsp;</small></div>
      <div class="kpi" style="--k:var(--neutral)"><span>ยังไม่เริ่ม</span><b>${s.not_started}</b><small>&nbsp;</small></div>
      <div class="kpi" style="--k:var(--warn)"><span>ชะลอ/ติดปัญหา</span><b>${s.on_hold}</b><small>&nbsp;</small></div>
      <div class="kpi" style="--k:var(--bad)"><span>เกินกำหนด</span><b class="${s.late ? "late" : ""}">${s.late}</b><small>ยังไม่แล้วเสร็จ</small></div>
    </div>
    <div class="dash">
      <div class="stack">
        <section class="panel"><h2>สถานะงาน</h2>${s.total ? statusBar(s) : `<div class="empty">ยังไม่มีงาน</div>`}</section>
        <section class="panel"><h2>งบประมาณ (ไม่รวมงานที่ยกเลิก)</h2>
          <div class="budget"><div><span>งบประมาณที่ได้รับอนุมัติ</span><b>${money(s.bp)}</b></div>
            <div><span>ใช้จริงแล้ว</span><b>${money(s.ba)}</b></div><div><span>คงเหลือ</span><b class="${s.bp - s.ba < 0 ? "late" : ""}">${money(s.bp - s.ba)}</b></div></div>
          <div class="meter ${used > 100 ? "over" : ""}"><i style="width:${Math.min(used, 100)}%"></i></div><div class="hint" style="margin-top:4px">ใช้ไป ${used}% ของงบประมาณ (หน่วย: บาท)</div>
        </section>
        ${S.scope !== "all" ? openTasksPanel(list) : ""}
        ${S.scope === "all" && S.units.length > 1 ? unitTable() : ""}
      </div>
      <div class="stack">
        <section class="panel"><h2>แยกตามหมวดงาน</h2>${hbars(list, "category", CATEGORY)}
          <div class="legend"><span><i style="background:var(--ok)"></i>แล้วเสร็จ</span><span><i style="background:var(--info);opacity:.55"></i>ยังไม่เสร็จ</span></div></section>
        <section class="panel"><h2>แยกตามที่มาของงาน</h2>${hbars(list, "source", SOURCE)}</section>
        <section class="panel"><h2>เกินกำหนด <span class="pill st-late">${late.length}</span></h2>${miniList(late)}</section>
        <section class="panel"><h2>ครบกำหนดใน 14 วัน</h2>${miniList(soon)}</section>
      </div>
    </div>`;
  bindScope(renderDashboard);
  $("#presentBtn").onclick = enterPresent;
  if ($("#stripBtn")) $("#stripBtn").onclick = openNotifs;
  $$("[data-task]").forEach(r => r.onclick = () => openTask(r.dataset.task));
  $$("[data-unit]").forEach(r => r.onclick = () => { S.scope = r.dataset.unit; renderDashboard(); window.scrollTo(0, 0); });
  if (S.scope !== "all") fillLatestNotes(S.scope);
  if (S.scope !== "all") disciplineStrip(S.scope);
}
/* งานที่ยังไม่แล้วเสร็จ: ที่มา/อ้างอิง · กำหนดเสร็จ · ความคืบหน้า · บันทึกล่าสุดจากประวัติ */
function openTasksPanel(list){
  const open = list.filter(isOpen).sort((a, b) => (a.due_date || "9999").localeCompare(b.due_date || "9999") || a.seq - b.seq);
  return `<section class="panel" id="openPanel"><h2>งานที่ยังไม่แล้วเสร็จ <span class="pill st-in_progress">${open.length}</span></h2>
    ${open.length ? `<div class="tbl-wrap"><table class="t open-tbl"><thead><tr><th>งาน / อ้างอิงที่มา</th><th>กำหนดเสร็จ</th><th>สถานะ / ความคืบหน้า</th><th>ความคืบหน้าล่าสุด</th></tr></thead><tbody>
      ${open.map(t => { const n = t.due_date ? daysLeft(t.due_date) : null;
        return `<tr class="click" data-task="${t.id}">
        <td style="min-width:200px"><span class="code">${esc(tcode(t))}</span><br><span class="ttl">${esc(t.title)}</span>
          <span class="src">${esc(SOURCE[t.source])}${t.meeting_ref ? " · " + esc(t.meeting_ref) : ""}</span></td>
        <td class="nowrap">${dTH(t.due_date)}${n === null ? "" : `<span class="due-left ${n < 0 ? "late" : n <= 3 ? "soon" : ""}">${leftText(t.due_date)}</span>`}</td>
        <td>${statusPill(t)}<div class="prog"><div class="meter"><i style="width:${t.progress}%"></i></div><span>${t.progress}%</span></div></td>
        <td style="min-width:180px" data-last="${t.id}"><span class="hint">กำลังโหลด…</span></td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">ไม่มีงานค้าง ทุกงานแล้วเสร็จหรือยกเลิกแล้ว</div>`}</section>`;
}
async function fillLatestNotes(unitId){
  if (!$("#openPanel [data-last]")) return;
  let logs = [];
  try { logs = await db.updatesForUnit(unitId); } catch (ex){ $$("#openPanel [data-last]").forEach(td => td.innerHTML = `<span class="err">โหลดประวัติไม่สำเร็จ</span>`); return; }
  if (S.scope !== unitId) return;                       // ผู้ใช้เปลี่ยนหน่วยงานระหว่างโหลด
  const pick = {};
  logs.forEach(l => { const cur = pick[l.task_id], rank = l.kind === "progress" ? 1 : 0;
    if (!cur || rank > cur.rank || (rank === cur.rank && l.created_at > cur.l.created_at)) pick[l.task_id] = {l, rank}; });
  $$("#openPanel [data-last]").forEach(td => { const x = pick[td.dataset.last], t = S.tasks.find(y => y.id === td.dataset.last), a = (S.act || {})[td.dataset.last];
    const flags = t ? (isStale(t) ? `<span class="flag">ไม่อัปเดต ${a && a.last_update_at ? daysAgo(a.last_update_at) + " วัน" : "เลย"}</span>` : "") + (isUnexplained(t) ? `<span class="flag">เกินกำหนด ยังไม่บันทึกเหตุผล</span>` : "") : "";
    td.innerHTML = (x ? `<span class="lastnote">${esc(x.l.note)}</span><span class="lastmeta">${dtTH(x.l.created_at)}${x.l.created_by_name ? " · " + esc(x.l.created_by_name) : ""}</span>`
                     : `<span class="hint">ยังไม่มีบันทึก</span>`) + flags; });
}
function miniList(list){
  if (!list.length) return `<div class="empty" style="padding:12px">ไม่มีรายการ</div>`;
  return `<div class="tbl-wrap"><table class="t"><tbody>${list.slice(0, 8).map(t => `
    <tr class="click" data-task="${t.id}"><td><span class="code">${esc(tcode(t))}</span><br><span class="ttl">${esc(t.title)}</span></td>
    <td class="nowrap ${isLate(t) ? "late" : ""}">${dTH(t.due_date)}</td></tr>`).join("")}</tbody></table></div>
    ${list.length > 8 ? `<div class="hint" style="margin-top:6px">และอีก ${list.length - 8} รายการ ดูทั้งหมดที่เมนูรายการงาน</div>` : ""}`;
}
function unitTable(){
  const rows = S.units.map(u => ({u, s:stats(S.tasks.filter(t => t.unit_id === u.id))}));
  return `<section class="panel"><h2>เปรียบเทียบรายหน่วยงาน</h2><div class="tbl-wrap"><table class="t">
    <thead><tr><th>หน่วยงาน</th><th class="n">งาน</th><th class="n">เสร็จ</th><th class="n">ดำเนินการ</th><th class="n">เกินกำหนด</th><th>% แล้วเสร็จ</th><th class="n">งบ / ใช้จริง</th></tr></thead>
    <tbody>${rows.map(({u, s}) => `<tr class="click" data-unit="${u.id}" title="ดูเฉพาะหน่วยงานนี้">
      <td><b>${esc(u.code)}</b> <span class="ref">${esc(u.name)}${u.active ? "" : " · ระงับ"}</span></td>
      <td class="n">${s.total}</td><td class="n">${s.done}</td><td class="n">${s.in_progress + s.on_hold}</td>
      <td class="n ${s.late ? "late" : ""}">${s.late}</td>
      <td><div class="prog"><div class="meter"><i style="width:${s.donePct}%;background:var(--ok)"></i></div><span>${s.donePct}%</span></div></td>
      <td class="n">${money(s.bp)}<span class="ref">${money(s.ba)}</span></td></tr>`).join("")}</tbody></table></div></section>`;
}
function enterPresent(){
  document.body.classList.add("present");
  const b = document.createElement("button"); b.className = "btn present-exit"; b.textContent = "ออกจากโหมดนำเสนอ";
  b.onclick = () => { document.body.classList.remove("present"); b.remove(); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); };
  document.body.appendChild(b);
  if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && document.body.classList.contains("present")){ document.body.classList.remove("present"); const b = $(".present-exit"); if (b) b.remove(); } });

/* =====================================================================
   รายการงาน
   ===================================================================== */
function filtered(){
  const q = S.f.q.trim().toLowerCase();
  return scopedTasks().filter(t =>
    (!S.f.status || (S.f.status === "late" ? isLate(t) : t.status === S.f.status)) &&
    (!S.f.category || t.category === S.f.category) && (!S.f.source || t.source === S.f.source) &&
    (!q || [t.title, t.detail, t.owner_name, t.meeting_ref, tcode(t)].some(v => String(v || "").toLowerCase().includes(q)))
  ).sort((a, b) => (unitOf(a.unit_id)?.code || "").localeCompare(unitOf(b.unit_id)?.code || "") || (b.seq - a.seq));
}
function statusPill(t){ return isLate(t) ? `<span class="pill st-late">เกินกำหนด</span>` : `<span class="pill st-${t.status}">${STATUS[t.status].label}</span>`; }

  $("#fs").value = S.f.status; $("#fc").value = S.f.category; $("#fo").value = S.f.source;

      ${list.map(t => `<tr class="click" data-task="${t.id}"><td class="code">${esc(tcode(t))}</td>
        <td><span class="ttl">${esc(t.title)}</span><span class="ref">${esc(SOURCE[t.source])}${t.meeting_ref ? " · " + esc(t.meeting_ref) : ""}</span></td>
        ${showUnit ? `<td class="nowrap">${esc(unitOf(t.unit_id)?.code)}</td>` : ""}
        <td class="nowrap">${esc(CATEGORY[t.category])}</td><td>${esc(t.owner_name || "–")}</td>
        <td class="nowrap ${isLate(t) ? "late" : ""}">${dTH(t.due_date)}</td><td>${statusPill(t)}</td>
        <td><div class="prog"><div class="meter"><i style="width:${t.progress}%"></i></div><span>${t.progress}%</span></div></td>

    if (all.length > list.length) $("#tlist").insertAdjacentHTML("beforeend", `<div class="more-row no-print"><span class="hint">แสดง ${list.length} จาก ${all.length} รายการ (ค้นหาหรือกรองเพื่อหาเร็วขึ้น)</span>

  draw();

  [["fs","status"],["fc","category"],["fo","source"]].forEach(([id, k]) => $("#" + id).onchange = e => { S.f[k] = e.target.value; S.listLimit = 300; draw(); });
  bindScope(renderTasks);
  if ($("#addBtn")) $("#addBtn").onclick = () => taskForm();
  if ($("#xlsBtn")) $("#xlsBtn").onclick = () => exportTaskListXlsx(filtered());
}

/* ---------- modal ---------- */
function modal(html, cls=""){
  const sc = document.createElement("div"); sc.className = "scrim";
  sc.innerHTML = `<div class="modal ${cls}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(sc);
  const close = () => { sc.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  sc.addEventListener("mousedown", e => { if (e.target === sc) close(); });
  $$("[data-close]", sc).forEach(b => b.onclick = close);
  const first = $("input,select,textarea,button:not(.x)", sc); if (first) setTimeout(() => first.focus(), 30);
  return {el:sc, close};
}
function confirmBox({title, body, ok="ยืนยัน", danger=false, requireText=""}){
  return new Promise(res => {
    const m = modal(`<div class="m-head"><h2>${esc(title)}</h2><button class="x" data-close aria-label="ปิด">×</button></div>
      <div class="m-body">${body}${requireText ? `<label class="f"><span>พิมพ์ <b>${esc(requireText)}</b> เพื่อยืนยัน</span><input id="cfTxt" type="text" autocomplete="off"></label>` : ""}</div>
      <div class="m-foot"><button class="btn" data-close>ยกเลิก</button><button class="btn ${danger ? "danger solid" : "primary"}" id="cfOk" ${requireText ? "disabled" : ""}>${esc(ok)}</button></div>`, "sm");
    let done = false; const finish = v => { if (!done){ done = true; res(v); } };
    if (requireText) $("#cfTxt", m.el).oninput = e => $("#cfOk", m.el).disabled = e.target.value.trim().toUpperCase() !== requireText.toUpperCase();
    $("#cfOk", m.el).onclick = () => { finish(requireText ? $("#cfTxt", m.el).value : true); m.close(); };
    const obs = new MutationObserver(() => { if (!document.body.contains(m.el)){ finish(false); obs.disconnect(); } });
    obs.observe(document.body, {childList:true});
  });
}

      <label class="f"><span>วันที่เริ่ม</span><input id="tfStart" type="date" value="${esc(t.start_date)}"></label>

      <label class="f"><span>วันที่แล้วเสร็จจริง</span><input id="tfFin" type="date" value="${esc(t.finished_date)}"></label>` : ""}

/* ---------- ช่วงวันที่ของรายงาน ---------- */
const RANGE_BASIS = {
  active:"งานที่ดำเนินการอยู่ในช่วงนี้",
  due:"กำหนดแล้วเสร็จอยู่ในช่วงนี้",
  finished:"แล้วเสร็จจริงในช่วงนี้",
  created:"บันทึกงานเข้าระบบในช่วงนี้"
};
function presetRange(k){
  const T = today(), m = Number(T.slice(5, 7)) - 1, y = T.slice(0, 4);
  if (k === "m0") return {from:monthStart(0), to:T};
  if (k === "m1") return {from:monthStart(-1), to:addDays(monthStart(0), -1)};
  if (k === "q0") return {from:monthStart(-(m % 3)), to:T};
  if (k === "y0") return {from:y + "-01-01", to:T};
  return {from:"", to:T};
}
const dayOf = localDay;   // วันที่ของเวลาบันทึก (เวลาไทย)
const between = d => !!d && (!S.rep.from || d >= S.rep.from) && d <= S.rep.to;
function inRange(t){
  const b = S.rep.basis;
  if (b === "due") return between(t.due_date);
  if (b === "finished") return between(t.finished_date);
  if (b === "created") return between(dayOf(t.created_at));
  // active: เริ่ม (หรือบันทึกเข้าระบบ) ไม่หลังวันสิ้นสุดช่วง และยังไม่ปิดงานก่อนวันเริ่มช่วง
  const begin = t.start_date || dayOf(t.created_at);
  if (begin && begin > S.rep.to) return false;
  if (!S.rep.from) return true;
  if (t.status === "done") return (t.finished_date || dayOf(t.updated_at)) >= S.rep.from;
  if (t.status === "cancelled") return dayOf(t.updated_at) >= S.rep.from;
  return true;
}
const lateAt = t => t.status !== "done" && t.status !== "cancelled" && t.due_date && t.due_date < S.rep.to;
const rangeLabel = () => S.rep.from ? `ช่วงข้อมูล ${dTH(S.rep.from, true)} ถึง ${dTH(S.rep.to, true)}` : `ข้อมูลทั้งหมดจนถึงวันที่ ${dTH(S.rep.to, true)}`;
const rangeTasksOf = list => list.filter(t => inRange(t) && (!S.rep.source || t.source === S.rep.source));
const filterLabel = () => "เกณฑ์: " + RANGE_BASIS[S.rep.basis] + (S.rep.source ? " · ที่มาของงาน: " + SOURCE[S.rep.source] : "");
function reportTasks(){
  const lateAsof = lateAt;
  return rangeTasksOf(scopedTasks()).filter(t => {
    if (S.rep.show === "with_cancel") return true;
    if (t.status === "cancelled") return false;
    if (S.rep.show === "open") return isOpen(t);
    if (S.rep.show === "done") return t.status === "done";
    if (S.rep.show === "late") return lateAsof(t);
    return true;
  }).sort((a, b) => a.seq - b.seq).map(t => ({...t, _late:lateAsof(t)}));
}
function latestNotes(updates){
  const m = {};
  updates.filter(l => l.kind === "progress" && localDay(l.created_at) <= S.rep.to).forEach(l => { if (!m[l.task_id] || m[l.task_id].created_at < l.created_at) m[l.task_id] = l; });
  return m;
}

const dNum = d => { if (!d) return "–"; const [y, m, dd] = String(d).slice(0, 10).split("-"); return `${dd}/${m}/${String(Number(y) + 543).slice(-2)}`; };
function pageHeader(model){

    <div class="ph-r">${rangeLabel()}<br>${esc(filterLabel())}<br><span class="ph-note">สถานะและความคืบหน้าตามข้อมูลล่าสุดในระบบ</span></div></div>`;

function signHTML(withTitles, review){
  const blank = "..............................................................";
  const rv = review ? `<div class="rev-note">ตรวจรับรองในระบบแล้ว (เดือน ${monthTH(review.period)}) โดย ${esc(review.reviewer_name || "-")} เมื่อ ${dtTH(review.reviewed_at)}</div>` : "";

function pageHTML(model, no, total, rowsHTML, withSummary, withSign, printedAt){
  const colg = `<colgroup>${model.cols.map(w => `<col style="width:${w}mm">`).join("")}</colgroup>`;
  return `<div class="page"><div class="pg-in">

    ${withSign ? model.sign : ""}
    <div class="pg-foot"><span>พิมพ์จากระบบติดตามงานหน่วยงาน เมื่อ ${printedAt}</span><span class="pgno">หน้า ${no}/${total}</span></div>
  </div></div>`;

async function paginateReport(model){
  const host = $("#sheet"); if (!host) return;
  const token = ++paginateToken;
  try { if (document.fonts && document.fonts.ready) await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2500))]); } catch (_){}
  if (token !== paginateToken || !document.body.contains(host)) return;
  const printedAt = dtTH(new Date().toISOString());
  // วัดความสูงจริงของแต่ละส่วนในหน้ากระดาษจำลองที่มองไม่เห็น
  const meas = document.createElement("div"); meas.className = "pages"; meas.setAttribute("aria-hidden", "true");
  meas.style.cssText = "position:absolute;left:-100000px;top:0;visibility:hidden;pointer-events:none";
  meas.innerHTML = pageHTML(model, 1, 1, model.rows.join(""), true, true, printedAt);
  document.body.appendChild(meas);
  const hgt = el => el ? el.getBoundingClientRect().height : 0;
  const H = hgt(meas.querySelector(".pg-in")), gap = 3 * MM, tol = 1.5 * MM;
  const hHead = hgt(meas.querySelector(".ph")), hFoot = hgt(meas.querySelector(".pg-foot"));
  const hSum = hgt(meas.querySelector(".sum")), hThead = hgt(meas.querySelector(".rt thead")), hSign = hgt(meas.querySelector(".sign"));
  const rowH = [...meas.querySelectorAll(".rt tbody tr")].map(hgt);
  meas.remove();
  // จัดแถวลงหน้า: หัวกระดาษ + หัวตารางทุกหน้า, สรุปเฉพาะหน้าแรก, ช่องลงนามหน้าสุดท้าย
  const base = hHead + hFoot + gap, tableCost = gap + hThead;
  const pages = []; let cur = {rows:[], summary:!!model.summary, sign:false};
  let used = base + (cur.summary ? hSum + gap : 0) + tableCost;
  rowH.forEach((h, i) => {
    if (cur.rows.length && used + h > H - tol){ pages.push(cur); cur = {rows:[], summary:false, sign:false}; used = base + tableCost; }
    cur.rows.push(i); used += h;
  });
  if (used + gap + hSign > H - tol){
    // ไม่ให้ช่องลงนามอยู่หน้าเดียวโดด ๆ: ย้ายแถวสุดท้ายไปขึ้นหน้าใหม่พร้อมช่องลงนาม
    const last = cur.rows && cur.rows.length > 1 ? cur.rows[cur.rows.length - 1] : null;
    const canMove = last !== null && base + tableCost + rowH[last] + gap + hSign <= H - tol;
    if (canMove) cur.rows.pop();
    pages.push(cur);
    cur = canMove ? {rows:[last], summary:false, sign:false} : {rows:null, summary:false, sign:false};
  }
  cur.sign = true; pages.push(cur);
  if (token !== paginateToken) return;
  host.innerHTML = pages.map((p, i) => pageHTML(model, i + 1, pages.length, p.rows === null ? null : p.rows.map(k => model.rows[k]).join(""), p.summary, p.sign, printedAt)).join("");
  host.dataset.pages = pages.length;
  const info = $("#rPages"); if (info) info.textContent = `รายงานนี้มี ${pages.length} หน้า (A4 แนวนอน)`;
}

const isReviewerRole = id => { const r = roleOf(id) || {}; return r.scope === "assigned" && !!r.can_review; };
const canReview = unitId => isAdmin() || (!!perm().can_review && !isOwnUnit() && !!unitOf(unitId));
const pendingPeriods = d => [d.cur_reviewed_by ? null : d.cur_period, (d.prev_reviewed_by || !d.prev_required) ? null : d.prev_period].filter(Boolean);
function reviewCell(by, at, required){
  if (by) return `<span class="rev-ok">ตรวจแล้ว</span><span class="rev-sub">${esc(by)} · ${dTH(localDay(at))}</span>`;
  return required ? `<span class="pill st-late">ค้างตรวจ</span>` : `<span class="hint">–</span>`;
}
async function disciplineStrip(unitId){
  const box = $("#discStrip"); if (!box) return;
  const list = S.tasks.filter(t => t.unit_id === unitId), stale = list.filter(isStale).length, unexp = list.filter(isUnexplained).length;
  let d = null;
  if (canReview(unitId)) { try { d = (await db.disciplineSummary()).find(x => x.unit_id === unitId); } catch (_){} }
  if (S.scope !== unitId || !$("#discStrip")) return;
  const chip = $("#revChip");
  if (chip && d){
    const pend = pendingPeriods(d);
    chip.innerHTML = d.cur_reviewed_by ? `<span class="rev-ok" title="ตรวจรับรองโดย ${esc(d.cur_reviewed_by)}">ตรวจรับรอง ${monthTH(d.cur_period)} แล้ว</span>`
      : `<button class="btn sm" id="revBtn">ตรวจรับรอง${pend.length ? " " + pend.map(monthTH).join(", ") : ""}</button>`;
    if ($("#revBtn")) $("#revBtn").onclick = () => reviewDialog(d);
  }
  if (!stale && !unexp){ box.innerHTML = ""; return; }
  box.innerHTML = `<div class="disc-strip" role="status"><span>วินัยการบันทึก: งานไม่อัปเดตเกิน ${STALE_DAYS} วัน <b>${stale}</b> งาน · เกินกำหนดยังไม่บันทึกเหตุผล <b>${unexp}</b> งาน</span><button class="btn sm" id="discBtn">ดูรายการ</button></div>`;
  $("#discBtn").onclick = () => unitDrill(unitId, d);
}

  const stale = list.filter(isStale).sort((a, b) => ((S.act[a.id] || {}).last_update_at || "").localeCompare((S.act[b.id] || {}).last_update_at || ""));
  const unexp = list.filter(isUnexplained).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const row = t => { const a = S.act[t.id] || {}; return `<tr class="click" data-task="${t.id}"><td class="code">${esc(tcode(t))}</td><td>${esc(t.title)}<span class="ref">${esc(t.owner_name || "ไม่ระบุผู้รับผิดชอบ")}</span></td>
    <td class="nowrap">${dTH(t.due_date)}${t.due_date && t.due_date < today() ? `<span class="ref late">${leftText(t.due_date)}</span>` : ""}</td><td class="nowrap">${a.last_update_at ? dTH(localDay(a.last_update_at)) : "–"}<span class="ref">${agoText(a.last_update_at)}</span></td></tr>`; };

      <p class="hint" style="margin:0">ผู้จัดการหน่วยงานแก้สถานะเหล่านี้ได้ด้วยการกด “บันทึกความคืบหน้า” ในงานนั้น</p>

      <label class="f ${issues ? "req" : ""}"><span>สิ่งที่สั่งการ / ติดตาม${issues ? " (ต้องระบุ เพราะมีงานที่ต้องติดตาม)" : ""}</span><textarea id="rvN" maxlength="2000" placeholder="เช่น ให้ผู้จัดการอัปเดตงานซ่อมปั๊มน้ำภายในวันศุกร์ และนำเสนอแผนงานทาสีในการประชุมครั้งถัดไป"></textarea></label>
      <label class="chk"><input type="checkbox" id="rvC"> <span>ข้าพเจ้าได้ตรวจสอบรายการงานและความคืบหน้าของหน่วยงานนี้ในระบบแล้ว</span></label>
      <div class="err" id="rvE" role="alert"></div>
    </div>
    <div class="m-foot"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn primary" id="rvS">บันทึกการตรวจรับรอง</button></div></form>`, "sm");
  $("#rvf", m.el).onsubmit = async e => {
    e.preventDefault(); const err = $("#rvE", m.el), note = $("#rvN", m.el).value.trim(); err.textContent = "";
    if (!$("#rvC", m.el).checked) return err.textContent = "กรุณายืนยันว่าได้ตรวจสอบข้อมูลแล้ว";
    if (issues && !note) return err.textContent = "หน่วยงานนี้มีงานที่ต้องติดตาม กรุณาระบุสิ่งที่สั่งการหรือติดตาม";
    $("#rvS", m.el).disabled = true;
    try { await db.reviewUnit(d.unit_id, $("#rvP", m.el).value, note); m.close(); toast("บันทึกการตรวจรับรอง " + d.code + " แล้ว"); refreshAfterReview(); }
    catch (ex){ err.textContent = thaiError(ex); $("#rvS", m.el).disabled = false; }
  };
}
function refreshAfterReview(){ if (S.view === "discipline") renderDiscipline(); else if (S.view === "dashboard") renderDashboard(); }

/* ---------- แจ้งเตือน ---------- */
function openNotifs(){
  const list = S.notifs || [];
  const m = modal(`<div class="m-head"><div><h2>แจ้งเตือนงานใกล้ครบกำหนด</h2><div class="hint">แจ้งครั้งเดียวเมื่องานที่ยังไม่แล้วเสร็จเหลือเวลาไม่เกิน ${dueDays()} วัน</div></div><button class="x" data-close aria-label="ปิด">×</button></div>
    <div class="m-body">${list.length ? `<ul class="nlist">${list.map(n => { const t = S.tasks.find(x => x.id === n.task_id); if (!t) return "";
      return `<li class="${n.is_read ? "read" : ""}"><button data-n="${n.id}" data-t="${t.id}"><span class="dotu" aria-hidden="true"></span>
        <span><span class="code">${esc(tcode(t))}${isAssigned() ? " · " + esc(unitOf(t.unit_id)?.name) : ""}</span><br><span class="ttl">${esc(t.title)}</span>
        <span class="ref">กำหนดเสร็จ ${dTH(t.due_date, true)} · ${esc(t.owner_name || "ไม่ระบุผู้รับผิดชอบ")} · ${statusLabel(t)}</span></span>
        <span class="when">${isOpen(t) ? leftText(t.due_date) : "ปิดงานแล้ว"}</span></button></li>`; }).join("")}</ul>`
      : `<div class="empty">ไม่มีงานที่จะครบกำหนดภายใน ${dueDays()} วัน</div>`}</div>
    <div class="m-foot">${unreadCount() ? `<button class="btn" id="readAll">ทำเครื่องหมายว่าอ่านแล้วทั้งหมด</button>` : ""}<button class="btn" data-close>ปิด</button></div>`, "sm");
  $$("[data-n]", m.el).forEach(b => b.onclick = async () => {
    try { await db.markRead([b.dataset.n]); await loadNotifs(); } catch (_){}
    m.close(); renderShell(); openTask(b.dataset.t);
  });
  if ($("#readAll", m.el)) $("#readAll", m.el).onclick = async () => {
    try { await db.markRead(list.filter(n => !n.is_read).map(n => n.id)); await loadNotifs(); m.close(); renderShell(); toast("อ่านแล้วทั้งหมด"); } catch (ex){ toast(thaiError(ex), true); }
  };
}
const statusLabel = t => STATUS[t.status] ? STATUS[t.status].label + (t.status !== "done" ? " " + t.progress + "%" : "") : "";

/* ---------- บังคับเปลี่ยนรหัสผ่านครั้งแรก ---------- */
function forcePasswordChange(){
  return new Promise(res => {
    const sc = document.createElement("div"); sc.className = "scrim";
    sc.innerHTML = `<form class="modal sm" id="fpf" role="dialog" aria-modal="true" novalidate><div class="m-head"><div><h2>ตั้งรหัสผ่านใหม่</h2><div class="hint">บัญชีนี้ใช้รหัสผ่านชั่วคราว กรุณาตั้งรหัสผ่านของคุณเองก่อนใช้งาน</div></div></div>
      <div class="m-body"><label class="f req"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัวอักษร)</span><input id="fp1" type="password" autocomplete="new-password"></label>
      <label class="f req"><span>ยืนยันรหัสผ่านใหม่</span><input id="fp2" type="password" autocomplete="new-password"></label><div class="err" id="fpErr" role="alert"></div></div>
      <div class="m-foot"><button type="button" class="btn" id="fpOut">ออกจากระบบ</button><button class="btn primary" id="fpSave">บันทึกรหัสผ่าน</button></div></form>`;
    document.body.appendChild(sc); setTimeout(() => $("#fp1", sc).focus(), 30);
    $("#fpOut", sc).onclick = async () => { await db.signOut(); S.me = null; sc.remove(); renderLogin(); res(false); };
    $("#fpf", sc).onsubmit = async e => {
      e.preventDefault(); const a = $("#fp1", sc).value, b = $("#fp2", sc).value, err = $("#fpErr", sc);
      if (a.length < 8) return err.textContent = "รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร"; if (a !== b) return err.textContent = "รหัสผ่านทั้งสองช่องไม่ตรงกัน";
      $("#fpSave", sc).disabled = true;
      try { await db.changePassword(a); await db.passwordChanged(); sc.remove(); toast("ตั้งรหัสผ่านใหม่แล้ว"); res(true); }
      catch (ex){ err.textContent = thaiError(ex); $("#fpSave", sc).disabled = false; }
    };
  });
}

/* ---------- คัดลอกข้อความ ---------- */
async function copyText(text, el){
  try { await navigator.clipboard.writeText(text); toast("คัดลอกแล้ว"); }
  catch (_){ if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("กด Ctrl+C (หรือ ⌘+C) เพื่อคัดลอกข้อความที่เลือกไว้"); }
}
function credentialsBox(title, login, password){
  const url = location.href.split("#")[0];
  const text = `ระบบติดตามงานหน่วยงาน\nลิงก์: ${url}\nชื่อผู้ใช้: ${login}\nรหัสผ่านชั่วคราว: ${password}\n(ระบบจะให้ตั้งรหัสผ่านใหม่เมื่อเข้าครั้งแรก)`;
  const m = modal(`<div class="m-head"><h2>${esc(title)}</h2><button class="x" data-close aria-label="ปิด">×</button></div>
    <div class="m-body"><p style="margin:0">ส่งข้อมูลนี้ให้ผู้ใช้ทางช่องทางส่วนตัว รหัสผ่านจะไม่แสดงอีกหลังปิดหน้าต่างนี้</p><div class="cred" id="credTxt">${esc(text)}</div></div>
    <div class="m-foot"><button class="btn primary" id="credCopy">คัดลอก</button><button class="btn" data-close>ปิด</button></div>`, "sm");
  $("#credCopy", m.el).onclick = () => copyText(text, $("#credTxt", m.el));
}

/* ---------- ลืมรหัสผ่าน (ส่งลิงก์ตั้งรหัสใหม่ทางอีเมล) ---------- */
function forgotPasswordDialog(prefill){
  const m = modal(`<form id="fgf" novalidate><div class="m-head"><div><h2>ลืมรหัสผ่าน</h2><div class="hint">กรอก Gmail ที่ใช้เข้าระบบ ระบบจะส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้</div></div><button type="button" class="x" data-close aria-label="ปิด">×</button></div>
    <div class="m-body"><label class="f req"><span>อีเมล (Gmail)</span><input id="fgEmail" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(prefill && prefill.includes("@") ? prefill : "")}"></label><div class="err" id="fgErr" role="alert"></div></div>
    <div class="m-foot"><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn primary" id="fgSend">ส่งลิงก์</button></div></form>`, "sm");
  setTimeout(() => $("#fgEmail", m.el).focus(), 30);
  $("#fgf", m.el).onsubmit = async e => { e.preventDefault(); const v = $("#fgEmail", m.el).value.trim(), err = $("#fgErr", m.el); err.textContent = "";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return err.textContent = "กรุณากรอกอีเมลให้ถูกต้อง";
    if (isUsername(v)) return err.textContent = "บัญชีแบบ User ID ไม่มีกล่องอีเมล กรุณาติดต่อผู้ดูแลระบบ สำนักงานใหญ่";
    $("#fgSend", m.el).disabled = true;
    try { await db.sendResetLink(v); m.close(); toast("ถ้าอีเมลนี้มีบัญชีในระบบ จะได้รับลิงก์ภายในไม่กี่นาที (ตรวจจดหมายขยะด้วย)"); }
    catch (ex){ err.textContent = /rate limit|too many/i.test(ex && ex.message || "") ? "ขอลิงก์บ่อยเกินไป กรุณารอสักครู่แล้วลองใหม่" : thaiError(ex); $("#fgSend", m.el).disabled = false; } };
}

      <label class="f req"><span>ยืนยันรหัสผ่านใหม่</span><input id="rc2" type="password" autocomplete="new-password"></label><div class="err" id="rcErr" role="alert"></div></div>
      <div class="m-foot"><button type="button" class="btn" id="rcOut">ยกเลิก</button><button class="btn primary" id="rcSave">บันทึกรหัสผ่าน</button></div></form>`;

/* =====================================================================
   เริ่มทำงาน
   ===================================================================== */
// กันฟอร์มทุกฟอร์มไม่ให้ส่งแบบเดิม (ซึ่งจะโหลดหน้าใหม่และข้อมูลที่พิมพ์หาย) แม้ปุ่มยังผูกคำสั่งไม่เสร็จ
document.addEventListener("submit", e => e.preventDefault(), true);
// หลังบันทึกสำเร็จ: โหลดข้อมูลใหม่ ถ้าเน็ตสะดุดให้แจ้ง แทนการเงียบหาย
async function refreshAll(){
  try { await reload(); renderShell(); return true; }
  catch (ex){ toast("บันทึกแล้ว แต่โหลดข้อมูลล่าสุดไม่สำเร็จ (" + thaiError(ex) + ") กรุณารีเฟรชหน้า", true); return false; }
}
/* ปุ่มรูปตา เปิด/ปิดการแสดงรหัสผ่าน — ใส่ให้ทุกช่องรหัสผ่านอัตโนมัติ */
const EYE_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7c1.9 0 3.5-.6 4.9-1.4"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function addEyes(root){
  $$('input[type="password"]:not([data-eye])', root).forEach(inp => {
    inp.dataset.eye = "1";
    const wrap = document.createElement("span"); wrap.className = "pw-wrap";
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const b = document.createElement("button"); b.type = "button"; b.className = "pw-eye"; b.innerHTML = EYE_ON;
    b.setAttribute("aria-label", "แสดงรหัสผ่าน"); b.title = "แสดงรหัสผ่าน";
    b.onclick = () => { const show = inp.type === "password"; inp.type = show ? "text" : "password"; b.innerHTML = show ? EYE_OFF : EYE_ON;
      const t = show ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน"; b.setAttribute("aria-label", t); b.title = t; inp.focus(); };
    wrap.appendChild(b);
  });
}
new MutationObserver(() => addEyes(document)).observe(document.body, {childList:true, subtree:true});

(async function start(){
  try {
    const hash = new URLSearchParams(location.hash.slice(1)), isRecovery = hash.get("type") === "recovery", linkErr = hash.get("error_code") || hash.get("error");
    await db.init();
    if (linkErr){ history.replaceState(null, "", location.pathname + location.search); return renderLogin(/expired/i.test(linkErr + (hash.get("error_description") || "")) ? "ลิงก์ตั้งรหัสผ่านหมดอายุหรือถูกใช้ไปแล้ว กรุณากด “ลืมรหัสผ่าน?” เพื่อขอลิงก์ใหม่" : "ลิงก์ไม่ถูกต้อง กรุณาขอลิงก์ใหม่"); }
    if (isRecovery){
      for (let i = 0; i < 20 && !(await db.session()); i++) await new Promise(r => setTimeout(r, 150));
      history.replaceState(null, "", location.pathname + location.search);
      if (await db.session()){ if (await recoveryPasswordDialog()) return afterLogin(); return renderLogin(); }
      return renderLogin("ลิงก์ตั้งรหัสผ่านหมดอายุ กรุณาขอลิงก์ใหม่");
    }
    if (await db.session()) await afterLogin(); else renderLogin();
  } catch (ex){
    $("#app").innerHTML = `<div class="login"><div class="card"><h2>เริ่มระบบไม่สำเร็จ</h2><p class="err">${esc(thaiError(ex))}</p><p class="hint">ตรวจสอบ SUPABASE_URL / SUPABASE_KEY ในไฟล์ index.html และการเชื่อมต่ออินเทอร์เน็ต</p></div></div>`;
  }
})();
</script>
